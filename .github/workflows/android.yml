name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v6

      # ========================================
      # Java 17
      # ========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ========================================
      # Android SDK
      # ========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ========================================
      # Prepare Android SDK
      # ========================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Android SDK Environment"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager version:"
          sdkmanager --version

          # ------------------------------------
          # Accept licenses
          # ------------------------------------
          echo ""
          echo "========================================"
          echo "Accepting Android SDK licenses"
          echo "========================================"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          # ------------------------------------
          # Show available Android 37 packages
          # ------------------------------------
          echo ""
          echo "========================================"
          echo "Available Android 37 Packages"
          echo "========================================"

          sdkmanager --list | grep -E \
            'platforms;android-37|build-tools;37' || true

          # ------------------------------------
          # Install Android API 37
          #
          # IMPORTANT:
          # sdkmanager package name is android-37.0
          # but the SDK directory used by Gradle
          # is platforms/android-37
          # ------------------------------------
          echo ""
          echo "========================================"
          echo "Installing Android SDK Platform 37"
          echo "========================================"

          sdkmanager --install "platforms;android-37.0"

          # ------------------------------------
          # Platform Tools
          # ------------------------------------
          echo ""
          echo "========================================"
          echo "Installing Android Platform Tools"
          echo "========================================"

          sdkmanager --install "platform-tools"

          # ------------------------------------
          # Build Tools
          # ------------------------------------
          echo ""
          echo "========================================"
          echo "Installing Android 37 Build Tools"
          echo "========================================"

          sdkmanager --install "build-tools;37.0.0"

          # ------------------------------------
          # Verify SDK
          # ------------------------------------
          echo ""
          echo "========================================"
          echo "Verifying Android SDK"
          echo "========================================"

          echo "Checking Android SDK Platform..."
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            echo "ERROR: Android API 37 platform was not installed."
            echo ""
            echo "Installed platforms:"
            ls -la "$ANDROID_SDK_ROOT/platforms/" || true
            exit 1
          fi

          echo "Android SDK Platform 37: OK"

          echo ""
          echo "Checking Platform Tools..."
          if [ ! -d "$ANDROID_SDK_ROOT/platform-tools" ]; then
            echo "ERROR: Platform Tools were not installed."
            exit 1
          fi

          echo "Android Platform Tools: OK"

          echo ""
          echo "Checking Build Tools..."
          if [ ! -d "$ANDROID_SDK_ROOT/build-tools/37.0.0" ]; then
            echo "ERROR: Build Tools 37.0.0 were not installed."
            echo ""
            echo "Installed Build Tools:"
            ls -la "$ANDROID_SDK_ROOT/build-tools/" || true
            exit 1
          fi

          echo "Android Build Tools 37.0.0: OK"

          echo ""
          echo "========================================"
          echo "Android SDK setup completed successfully"
          echo "========================================"

      # ========================================
      # Gradle
      # ========================================
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      # ========================================
      # Verify Java
      # ========================================
      - name: Verify Java version
        run: |
          echo "========================================"
          echo "Java Version"
          echo "========================================"

          java -version

      # ========================================
      # Verify Gradle
      # ========================================
      - name: Verify Gradle version
        run: |
          echo "========================================"
          echo "Gradle Version"
          echo "========================================"

          ./gradlew --version

      # ========================================
      # Verify Android project
      # ========================================
      - name: Verify Android project configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking Android Project"
          echo "========================================"

          echo "Checking Android API 37..."
          test -d "$ANDROID_SDK_ROOT/platforms/android-37"

          echo "Android API 37: OK"

          echo ""
          echo "Checking Gradle Wrapper..."

          test -f "./gradlew"
          test -f "./gradle/wrapper/gradle-wrapper.jar"
          test -f "./gradle/wrapper/gradle-wrapper.properties"

          echo "Gradle Wrapper: OK"

          echo ""
          echo "Android project configuration verified."

      # ========================================
      # Build Debug APK
      # ========================================
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # ========================================
      # Upload APK
      # ========================================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my_coding-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
