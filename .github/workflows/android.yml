name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v6

      # ========================================
      # Java 17
      # ========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ========================================
      # Android SDK
      # ========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ========================================
      # Prepare Android SDK
      # ========================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Android SDK Environment"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager version:"
          sdkmanager --version

          echo ""
          echo "========================================"
          echo "Accepting Android SDK licenses"
          echo "========================================"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo ""
          echo "========================================"
          echo "Available Android 37 Packages"
          echo "========================================"

          sdkmanager --list | grep -E \
            'platforms;android-37|build-tools;37' || true

          echo ""
          echo "========================================"
          echo "Installing Android SDK Platform 37"
          echo "========================================"

          sdkmanager --install "platforms;android-37.0"

          echo ""
          echo "========================================"
          echo "Installing Android Platform Tools"
          echo "========================================"

          sdkmanager --install "platform-tools"

          echo ""
          echo "========================================"
          echo "Finding Android 37 Build Tools"
          echo "========================================"

          BUILD_TOOLS=$(
            sdkmanager --list \
              | grep -oE 'build-tools;37\.[0-9.]+' \
              | sort -V \
              | tail -1
          )

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android 37 Build Tools were not found."
            echo ""
            echo "Available Build Tools:"
            sdkmanager --list | grep "build-tools;" || true
            exit 1
          fi

          echo "Selected Build Tools:"
          echo "$BUILD_TOOLS"

          echo ""
          echo "========================================"
          echo "Installing $BUILD_TOOLS"
          echo "========================================"

          sdkmanager --install "$BUILD_TOOLS"

          echo ""
          echo "========================================"
          echo "Verifying Android SDK"
          echo "========================================"

          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/$BUILD_TOOLS"

          echo ""
          echo "Android SDK Platform 37.0: OK"
          echo "Android Platform Tools: OK"
          echo "Android Build Tools: $BUILD_TOOLS"

          echo ""
          echo "Android SDK setup completed successfully."

      # ========================================
      # Gradle
      # ========================================
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      # ========================================
      # Verify Java
      # ========================================
      - name: Verify Java version
        run: |
          echo "Java version:"
          java -version

      # ========================================
      # Verify Gradle
      # ========================================
      - name: Verify Gradle version
        run: |
          echo "Gradle version:"
          ./gradlew --version

      # ========================================
      # Verify Android project
      # ========================================
      - name: Verify Android project configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking Android SDK Platform 37"
          echo "========================================"

          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"

          echo "Android SDK Platform 37.0: OK"

          echo ""
          echo "========================================"
          echo "Checking Gradle Wrapper"
          echo "========================================"

          test -f "./gradlew"
          test -f "./gradle/wrapper/gradle-wrapper.jar"
          test -f "./gradle/wrapper/gradle-wrapper.properties"

          echo "Gradle Wrapper: OK"

          echo ""
          echo "All required files and SDK components are present."

      # ========================================
      # Build Debug APK
      # ========================================
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # ========================================
      # Upload APK
      # ========================================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my_coding-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
