name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Android SDK Environment"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager version:"
          sdkmanager --version

          echo ""
          echo "========================================"
          echo "Refreshing SDK package information"
          echo "========================================"

          sdkmanager --update || true

          echo ""
          echo "========================================"
          echo "Accepting Android SDK licenses"
          echo "========================================"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo ""
          echo "========================================"
          echo "Checking Android 17 / API 37"
          echo "========================================"

          sdkmanager --list | grep -E 'platforms;android-37|build-tools;37' || true

          echo ""
          echo "========================================"
          echo "Installing Android SDK Platform 37"
          echo "========================================"

          sdkmanager --install "platforms;android-37"

          echo ""
          echo "========================================"
          echo "Installing Platform Tools"
          echo "========================================"

          sdkmanager --install "platform-tools"

          echo ""
          echo "========================================"
          echo "Finding Android 17 Build Tools"
          echo "========================================"

          BUILD_TOOLS=$(
            sdkmanager --list \
              | grep -oE 'build-tools;37\.[0-9.]+' \
              | sort -V \
              | tail -1
          )

          if [ -z "$BUILD_TOOLS" ]; then
            echo "ERROR: Android 17 Build Tools were not found."
            echo ""
            echo "Available Build Tools:"
            sdkmanager --list | grep "build-tools;" || true
            exit 1
          fi

          echo "Latest Android 17 Build Tools:"
          echo "$BUILD_TOOLS"

          echo ""
          echo "========================================"
          echo "Installing $BUILD_TOOLS"
          echo "========================================"

          sdkmanager --install "$BUILD_TOOLS"

          echo ""
          echo "========================================"
          echo "Verifying Android SDK"
          echo "========================================"

          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            echo "ERROR: platforms/android-37 was not installed."
            exit 1
          fi

          echo "Android SDK Platform 37: OK"
          echo "Android Platform Tools: OK"
          echo "Android Build Tools: $BUILD_TOOLS"
          echo ""
          echo "Android SDK setup completed successfully."

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Verify Java version
        run: java -version

      - name: Verify Gradle version
        run: ./gradlew --version

      - name: Verify Android project configuration
        run: |
          echo "Checking Android SDK Platform 37..."
          test -d "$ANDROID_SDK_ROOT/platforms/android-37"

          echo "Checking Gradle wrapper..."
          test -f "./gradlew"
          test -f "./gradle/wrapper/gradle-wrapper.jar"
          test -f "./gradle/wrapper/gradle-wrapper.properties"

          echo "All required files and SDK components are present."

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: my_coding-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
